[project]
name = "pitlake-counterfactual"
version = "0.1.0"
description = "Withhold information from a point-in-time world exported by PITLake and see what your agent decides without it"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pitlake-counterfactual = "pitlake_counterfactual.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitlake_counterfactual"]

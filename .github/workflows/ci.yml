name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target to deploy after the checks pass
        type: choice
        options: [dev, prod]
        default: dev

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Spark tests (quality rules, knowable_at)
        run: >-
          uv run --with "pyspark>=4.0,<5" --with pytest-github-actions-annotate-failures
          pytest tests/spark -rf
        env:
          PITLAKE_REQUIRE_SPARK: "1"
      - run: uv build --wheel --package pitlake --out-dir dist/pitlake
      - run: uv build --wheel --package pitlake-collector --out-dir dist/collector
      - run: uv build --wheel --package pitlake-counterfactual --out-dir dist/engine
      - name: The released engine outside a checkout
        run: |
          python3 -m venv "$RUNNER_TEMP/outside"
          "$RUNNER_TEMP/outside/bin/pip" install dist/engine/*.whl
          cp engine/tests/fixture.py engine/tests/scripted.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          outside/bin/python fixture.py world.json
          outside/bin/pitlake-counterfactual ablate world.json --withhold bar:AAPL/2025-01-31 \
            --agent scripted:complete --samples 3 --out result

  doccheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - run: opam install dune --yes
      - run: opam exec -- make doccheck

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - run: npm run build --prefix app

  deploy:
    needs: [check, doccheck, web]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'dev' }}
    concurrency:
      group: deploy-${{ inputs.target || 'dev' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target || 'dev' }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@v1.17.0
      - run: databricks bundle validate -t "$TARGET"
      - run: databricks bundle deploy -t "$TARGET"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target to deploy after the checks pass
        type: choice
        options: [dev, prod]
        default: dev

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Spark tests (quality rules, knowable_at)
        run: >-
          uv run --with "pyspark>=4.0,<5" --with pytest-github-actions-annotate-failures
          pytest tests/spark -rf
        env:
          PITLAKE_REQUIRE_SPARK: "1"
      - run: uv build --wheel --package pitlake --out-dir dist/pitlake
      - run: uv build --wheel --package pitlake-collector --out-dir dist/collector

  doccheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - run: opam install dune --yes
      - run: opam exec -- make doccheck

  deploy:
    needs: [check, doccheck]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'dev' }}
    concurrency:
      group: deploy-${{ inputs.target || 'dev' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target || 'dev' }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@v1.17.0
      - run: databricks bundle validate -t "$TARGET"
      - run: databricks bundle deploy -t "$TARGET"

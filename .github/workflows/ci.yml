name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Spark tests (quality rules, knowable_at)
        run: >-
          uv run --with "pyspark>=4.0,<5" --with pytest-github-actions-annotate-failures
          pytest tests/spark -rf
        env:
          PITLAKE_REQUIRE_SPARK: "1"
      - run: uv build --wheel --package pitlake --out-dir dist/pitlake
      - run: uv build --wheel --package pitlake-collector --out-dir dist/collector

  doccheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - run: opam install dune --yes
      - run: opam exec -- make doccheck

[project]
name = "pitlake"
version = "0.2.0"
description = "Point-in-time market data lakehouse on Databricks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
smoke = "pitlake.jobs.smoke:main"
plan_ingest = "pitlake.jobs.plan_ingest:main"
discover_manifests = "pitlake.jobs.discover_manifests:main"
load_bronze = "pitlake.jobs.load_bronze:main"
commit_ingest = "pitlake.jobs.commit_ingest:main"
plan_transform = "pitlake.jobs.plan_transform:main"
transform_silver = "pitlake.jobs.transform_silver:main"
quality_gate = "pitlake.jobs.quality_gate:main"
commit_transform = "pitlake.jobs.commit_transform:main"
build_gold = "pitlake.jobs.build_gold:main"
commit_gold = "pitlake.jobs.commit_gold:main"
research = "pitlake.jobs.research:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitlake"]

[tool.uv.workspace]
members = ["collector"]

[tool.uv.sources]
pitlake-collector = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pitlake-collector"]

[tool.pytest.ini_options]
testpaths = ["tests", "collector/tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src", "collector/src", "collector/tests", "tests/spark"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "collector/src", "collector/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# API keys and the SEC contact come from the `pitlake` secret scope, never from this file.
catalog = "pitlake_rehearsal"
work_dir = "data/work"
max_files_per_cycle = 0
request_interval_seconds = 0.5

[[feeds]]
source = "binance"
dataset = "spot_trades"
symbols = ["BTCUSDT"]

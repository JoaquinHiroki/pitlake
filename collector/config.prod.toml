# API keys and the SEC contact come from the `pitlake` secret scope, never from this file.
catalog = "pitlake_prod"
work_dir = "/var/lib/pitlake-collector"
interval_minutes = 60
max_files_per_cycle = 0
request_interval_seconds = 0.5

[[feeds]]
source = "binance"
dataset = "spot_trades"
symbols = ["BTCUSDT"]
start_date = 2025-01-01

[[feeds]]
source = "coinbase"
dataset = "spot_candles_1m"
symbols = ["BTC-USD"]
start_date = 2025-01-01

[[feeds]]
source = "fred"
dataset = "series_vintages"
symbols = ["UNRATE", "CPIAUCSL", "FEDFUNDS"]
start_date = 2024-01-01

[[feeds]]
source = "alpaca"
dataset = "stock_trades"
symbols = ["SPY", "AAPL", "MSFT", "NVDA"]
start_date = 2025-01-01

[[feeds]]
source = "alpaca"
dataset = "stock_bars_1d"
symbols = ["SPY", "AAPL", "MSFT", "NVDA"]
start_date = 2025-01-01

[[feeds]]
source = "edgar"
dataset = "company_facts"
symbols = ["AAPL", "MSFT", "NVDA"]
start_date = 2024-01-01

[[feeds]]
source = "edgar"
dataset = "filings"
symbols = ["AAPL", "MSFT", "NVDA"]
start_date = 2024-01-01

# Collector configuration for the prod catalog. The `collect` task of pitlake-ingest-prod reads it
# from the bundle's workspace files. On the fallback VM it is copied to /etc/pitlake/collector.toml.
# Credentials never go here.
catalog = "pitlake_prod"
work_dir = "/var/lib/pitlake-collector"
interval_minutes = 60
# Only used by `run` mode on a VM; the ingest job passes its own max_files parameter.
max_files_per_cycle = 0
request_interval_seconds = 0.5

[[feeds]]
source = "binance"
dataset = "spot_trades"
symbols = ["BTCUSDT"]
start_date = 2025-01-01
# No end_date: each daily run collects up to yesterday, oldest missing day first.

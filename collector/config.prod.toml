# Collector configuration for the prod catalog. The `collect` task of pitlake-ingest-prod reads it
# from the bundle's workspace files. On the fallback VM it is copied to /etc/pitlake/collector.toml.
# Credentials never go here.
catalog = "pitlake_prod"
work_dir = "/var/lib/pitlake-collector"
interval_minutes = 60
# Only used by `run` mode on a VM; the ingest job passes its own max_files parameter.
max_files_per_cycle = 0
request_interval_seconds = 0.5

[[feeds]]
source = "binance"
dataset = "spot_trades"
symbols = ["BTCUSDT"]
start_date = 2025-01-01
# No end_date: each daily run collects up to yesterday, oldest missing day first.

[[feeds]]
source = "coinbase"
dataset = "spot_candles_1m"
symbols = ["BTC-USD"]
# Same history as Binance, for the Stage 4 cross-venue comparison.
start_date = 2025-01-01

# Vintages from 2024 on, so the vintage in force on 2025-01-01 (the first day of crypto data) is
# there. The key comes from the `pitlake` secret scope (fred-api-key), never from this file.
[[feeds]]
source = "fred"
dataset = "series_vintages"
symbols = ["UNRATE", "CPIAUCSL", "FEDFUNDS"]
start_date = 2024-01-01

# SPY and three of the largest companies, chosen so Stage 5 can join them to their SEC filings.
# The keys come from the `pitlake` secret scope (alpaca-key-id, alpaca-secret-key).
[[feeds]]
source = "alpaca"
dataset = "stock_trades"
symbols = ["SPY", "AAPL", "MSFT", "NVDA"]
start_date = 2025-01-01

[[feeds]]
source = "alpaca"
dataset = "stock_bars_1d"
symbols = ["SPY", "AAPL", "MSFT", "NVDA"]
start_date = 2025-01-01

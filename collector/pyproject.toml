[project]
name = "pitlake-collector"
version = "0.1.0"
description = "Fetches public market data and lands it, untouched and verified, in the PITLake landing volume"
requires-python = ">=3.11"
dependencies = [
    "pitlake",
    "databricks-sdk>=0.50",
    "requests>=2.32",
]

[project.scripts]
pitlake-collector = "pitlake_collector.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitlake_collector"]

[tool.uv.sources]
pitlake = { workspace = true }

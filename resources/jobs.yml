resources:
  jobs:
    smoke:
      name: pitlake-smoke-${bundle.target}
      description: Proves the deployment works - checks schemas and the landing volume, writes to control.deploy_log.
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
      tasks:
        - task_key: smoke
          environment_key: default
          python_wheel_task:
            package_name: pitlake
            entry_point: smoke
            parameters: ["--catalog", "${var.catalog}"]

    ingest:
      name: pitlake-ingest-${bundle.target}
      description: >-
        Collects missing source files into the landing volume, records their manifests, loads them
        into Bronze, and commits the new Bronze versions only if every source succeeded. Safe to
        re-run at any time; reloading a period never duplicates rows. Sources run in parallel, one
        for_each iteration per dataset in control.source_registry (ADR 0005), or only for the
        datasets named in `datasets`, between period_start and period_end (ADR 0012).
      max_concurrent_runs: 1
      timeout_seconds: 10800
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: UTC
        pause_status: ${var.ingest_schedule_status}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: max_files
          default: "30"
        - name: period_start
          default: ""
        - name: period_end
          default: ""
        - name: reload
          default: "false"
        - name: datasets
          default: ""
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
              - ../dist/collector/*.whl
      tasks:
        - task_key: plan
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: plan_ingest
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--datasets"
              - "{{job.parameters.datasets}}"

        - task_key: collect
          depends_on:
            - task_key: plan
          for_each_task:
            inputs: "{{tasks.plan.values.datasets}}"
            concurrency: ${var.ingest_concurrency}
            task:
              task_key: collect_feed
              environment_key: default
              max_retries: 1
              min_retry_interval_millis: 300000
              python_wheel_task:
                package_name: pitlake-collector
                entry_point: pitlake-collector
                parameters:
                  - "sync"
                  - "--config"
                  - "${workspace.file_path}/collector/config.${bundle.target}.toml"
                  - "--feed"
                  - "{{input}}"
                  - "--landing"
                  - "volume"
                  - "--private-work-dir"
                  - "--max-files"
                  - "{{job.parameters.max_files}}"
                  - "--start"
                  - "{{job.parameters.period_start}}"
                  - "--end"
                  - "{{job.parameters.period_end}}"

        - task_key: discover_manifests
          depends_on:
            - task_key: collect
          run_if: ALL_DONE
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: discover_manifests
            parameters: ["--catalog", "${var.catalog}"]

        - task_key: load_bronze
          depends_on:
            - task_key: discover_manifests
          for_each_task:
            inputs: "{{tasks.plan.values.datasets}}"
            concurrency: ${var.ingest_concurrency}
            task:
              task_key: load_dataset
              environment_key: default
              max_retries: 2
              min_retry_interval_millis: 120000
              python_wheel_task:
                package_name: pitlake
                entry_point: load_bronze
                parameters:
                  - "--catalog"
                  - "${var.catalog}"
                  - "--dataset"
                  - "{{input}}"
                  - "--max-files"
                  - "{{job.parameters.max_files}}"
                  - "--period-start"
                  - "{{job.parameters.period_start}}"
                  - "--period-end"
                  - "{{job.parameters.period_end}}"
                  - "--reload"
                  - "{{job.parameters.reload}}"
                  - "--run-id"
                  - "{{job.run_id}}"

        - task_key: commit
          depends_on:
            - task_key: collect
            - task_key: discover_manifests
            - task_key: load_bronze
          run_if: ALL_SUCCESS
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: commit_ingest
            parameters: ["--catalog", "${var.catalog}", "--run-id", "{{job.run_id}}"]

    transform:
      name: pitlake-transform-${bundle.target}
      description: >-
        Cleans the committed Bronze versions into Silver: types every column, assigns knowable_at,
        quarantines rows that fail a drop rule and stops on a halt rule (spec sections 5 and 6,
        ADR 0006). The quality gate then compares the two crypto venues minute by minute and checks
        rejection rates against control.quality_thresholds (ADR 0007); the new Silver versions are
        committed only if every table and the gate passed. Gold is then built from the committed
        Silver versions, audited for leakage, and committed only if the audit finds no case
        (ADR 0008). Starts when the ingest job commits.
      max_concurrent_runs: 1
      timeout_seconds: 10800
      trigger:
        pause_status: ${var.transform_trigger_status}
        table_update:
          table_names:
            - ${var.catalog}.control.ingest_commits
          condition: ANY_UPDATED
          wait_after_last_change_seconds: 60
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: max_files
          default: "30"
        - name: period_start
          default: ""
        - name: period_end
          default: ""
        - name: reprocess
          default: "false"
        - name: inject_fault
          default: "none"
        - name: datasets
          default: ""
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
      tasks:
        - task_key: plan
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: plan_transform
            parameters:
              ["--catalog", "${var.catalog}", "--datasets", "{{job.parameters.datasets}}"]

        - task_key: transform
          depends_on:
            - task_key: plan
          for_each_task:
            inputs: "{{tasks.plan.values.groups}}"
            concurrency: ${var.transform_concurrency}
            task:
              task_key: transform_group
              environment_key: default
              max_retries: 1
              min_retry_interval_millis: 120000
              python_wheel_task:
                package_name: pitlake
                entry_point: transform_silver
                parameters:
                  - "--catalog"
                  - "${var.catalog}"
                  - "--datasets"
                  - "{{input}}"
                  - "--max-files"
                  - "{{job.parameters.max_files}}"
                  - "--period-start"
                  - "{{job.parameters.period_start}}"
                  - "--period-end"
                  - "{{job.parameters.period_end}}"
                  - "--reprocess"
                  - "{{job.parameters.reprocess}}"
                  - "--inject-fault"
                  - "{{job.parameters.inject_fault}}"
                  - "--run-id"
                  - "{{job.run_id}}"

        - task_key: gate
          depends_on:
            - task_key: transform
          run_if: ALL_SUCCESS
          environment_key: default
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: pitlake
            entry_point: quality_gate
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--run-id"
              - "{{job.run_id}}"
              - "--period-start"
              - "{{job.parameters.period_start}}"
              - "--period-end"
              - "{{job.parameters.period_end}}"
              - "--reprocess"
              - "{{job.parameters.reprocess}}"
              - "--inject-fault"
              - "{{job.parameters.inject_fault}}"

        - task_key: commit
          depends_on:
            - task_key: gate
          run_if: ALL_SUCCESS
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: commit_transform
            parameters: ["--catalog", "${var.catalog}", "--run-id", "{{job.run_id}}"]

        - task_key: gold
          depends_on:
            - task_key: commit
          run_if: ALL_SUCCESS
          environment_key: default
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: pitlake
            entry_point: build_gold
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--run-id"
              - "{{job.run_id}}"
              - "--period-start"
              - "{{job.parameters.period_start}}"
              - "--period-end"
              - "{{job.parameters.period_end}}"
              - "--reprocess"
              - "{{job.parameters.reprocess}}"
              - "--inject-fault"
              - "{{job.parameters.inject_fault}}"

        - task_key: commit_gold
          depends_on:
            - task_key: gold
          run_if: ALL_SUCCESS
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: commit_gold
            parameters: ["--catalog", "${var.catalog}", "--run-id", "{{job.run_id}}"]

    research:
      name: pitlake-research-${bundle.target}
      description: >-
        Runs on demand. Records the committed Gold version it reads, builds the backtest inputs
        through pitlake.pit.as_of, runs the strategy over the parameter grid, and logs every backtest
        to MLflow and control.backtest_runs with its parameters, results, code version and table
        versions. With replay set to a backtest or research run ID, it reads the recorded versions
        again and fails unless every result is identical (ADR 0009).
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: start
          default: "2025-02-01"
        - name: end
          default: ""
        - name: replay
          default: ""
      environments:
        - environment_key: research
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
              - mlflow-skinny>=2.20,<4
      tasks:
        - task_key: backtest
          environment_key: research
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: pitlake
            entry_point: research
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--experiment"
              - "/Users/${workspace.current_user.userName}/pitlake-backtests-${bundle.target}"
              - "--start"
              - "{{job.parameters.start}}"
              - "--end"
              - "{{job.parameters.end}}"
              - "--replay"
              - "{{job.parameters.replay}}"
              - "--code-commit"
              - "${bundle.git.commit}"
              - "--run-id"
              - "{{job.run_id}}"

    counterfactual:
      name: pitlake-counterfactual-${bundle.target}
      description: >-
        Runs on demand. For a recorded backtest or research run (default the latest), enumerates
        every daily bar, filing and FRED release that was knowable at its last decision, rebuilds
        the backtest's inputs through pitlake.pit.as_of from those items alone, and fails unless the
        rebuilt input hash equals the recorded one with no item unaccounted for. With omit set to an
        item ID, that item is left out on purpose, which must fail (ADR 0022). Then ablate removes
        the withheld items and samples from Gold, recomputes what depended on them, and fails
        unless every ablated world equals a full rebuild without them (ADR 0023).
      max_concurrent_runs: 1
      timeout_seconds: 7200
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: backtest
          default: ""
        - name: omit
          default: ""
        - name: withhold
          default: ""
        - name: sample
          default: "0"
        - name: mode
          default: coherent
      environments:
        - environment_key: counterfactual
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
      tasks:
        - task_key: enumerate
          environment_key: counterfactual
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: pitlake
            entry_point: information_set
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--backtest"
              - "{{job.parameters.backtest}}"
              - "--omit"
              - "{{job.parameters.omit}}"
              - "--code-commit"
              - "${bundle.git.commit}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: ablate
          depends_on:
            - task_key: enumerate
          environment_key: counterfactual
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: pitlake
            entry_point: ablation
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--backtest"
              - "{{job.parameters.backtest}}"
              - "--withhold"
              - "{{job.parameters.withhold}}"
              - "--sample"
              - "{{job.parameters.sample}}"
              - "--mode"
              - "{{job.parameters.mode}}"
              - "--code-commit"
              - "${bundle.git.commit}"
              - "--run-id"
              - "{{job.run_id}}"

    harness:
      name: pitlake-harness-${bundle.target}
      description: >-
        Runs on demand. Decides at a recorded backtest's instant (default its last decision) in the
        real world or in one with items withheld: the backtest strategy and the time-locked agent,
        which rates each symbol overweight, neutral or underweight through point-in-time tools over
        that world. Each decider is sampled in rounds; the job records every sample and fails unless
        each decision is the same in every round and enough samples agree. With replay set to a
        harness run ID it decides those points again and fails unless they match (ADR 0024).
      max_concurrent_runs: 1
      timeout_seconds: 7200
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: backtest
          default: ""
        - name: at
          default: ""
        - name: withhold
          default: ""
        - name: deciders
          default: strategy agent
        - name: samples
          default: "10"
        - name: rounds
          default: "2"
        - name: min_agreement
          default: "0.8"
        - name: replay
          default: ""
      environments:
        - environment_key: harness
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
              - databricks-sdk>=0.50
      tasks:
        - task_key: decide
          environment_key: harness
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: pitlake
            entry_point: decide
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--endpoint"
              - "${var.chat_endpoint}"
              - "--backtest"
              - "{{job.parameters.backtest}}"
              - "--at"
              - "{{job.parameters.at}}"
              - "--withhold"
              - "{{job.parameters.withhold}}"
              - "--deciders"
              - "{{job.parameters.deciders}}"
              - "--samples"
              - "{{job.parameters.samples}}"
              - "--rounds"
              - "{{job.parameters.rounds}}"
              - "--min-agreement"
              - "{{job.parameters.min_agreement}}"
              - "--replay"
              - "{{job.parameters.replay}}"
              - "--code-commit"
              - "${bundle.git.commit}"
              - "--run-id"
              - "{{job.run_id}}"

    attribution:
      name: pitlake-attribution-${bundle.target}
      description: >-
        Runs on demand. For each decider and instant of a recorded backtest (default its last
        decision), decides in the real world, then again in the null world and in a world without
        each item that was knowable, one at a time, and records what each removal changed: the
        strategy's weights exactly, and the agent's settled ratings with a p-value, sampling it only
        where a removal changes what its tools return. Stops starting worlds after minutes and
        continues where it stopped when run again with the same parameters. Fails if the null world
        changes a decision or a changed world differs from a full rebuild (ADR 0025).
      max_concurrent_runs: 1
      timeout_seconds: 7200
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: backtest
          default: ""
        - name: at
          default: ""
        - name: deciders
          default: strategy agent
        - name: samples
          default: "10"
        - name: min_agreement
          default: "0.8"
        - name: bars
          default: "3"
        - name: verify
          default: changed
        - name: minutes
          default: "100"
      environments:
        - environment_key: attribution
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
              - databricks-sdk>=0.50
      tasks:
        - task_key: attribute
          environment_key: attribution
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: pitlake
            entry_point: attribute
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--endpoint"
              - "${var.chat_endpoint}"
              - "--backtest"
              - "{{job.parameters.backtest}}"
              - "--at"
              - "{{job.parameters.at}}"
              - "--deciders"
              - "{{job.parameters.deciders}}"
              - "--samples"
              - "{{job.parameters.samples}}"
              - "--min-agreement"
              - "{{job.parameters.min_agreement}}"
              - "--bars"
              - "{{job.parameters.bars}}"
              - "--verify"
              - "{{job.parameters.verify}}"
              - "--minutes"
              - "{{job.parameters.minutes}}"
              - "--code-commit"
              - "${bundle.git.commit}"
              - "--run-id"
              - "{{job.run_id}}"

    sufficiency:
      name: pitlake-sufficiency-${bundle.target}
      description: >-
        Runs on demand. For each decider and instant of a recorded backtest (default its last
        decision), searches for a minimal set of the items knowable there that still gives the same
        decision: it withholds everything else, drops chunks of items while the decision holds, and
        ends when no single item left can go. Then it builds the world from that set alone, decides
        again, checks it against a full rebuild and records it as an ablation for the independent
        check. Stops starting worlds after minutes and continues where it stopped when run again
        with the same parameters (ADR 0026).
      max_concurrent_runs: 1
      timeout_seconds: 7200
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: backtest
          default: ""
        - name: at
          default: ""
        - name: deciders
          default: strategy agent
        - name: samples
          default: "10"
        - name: min_agreement
          default: "0.8"
        - name: verify
          default: final
        - name: minutes
          default: "100"
      environments:
        - environment_key: sufficiency
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
              - databricks-sdk>=0.50
      tasks:
        - task_key: suffice
          environment_key: sufficiency
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: pitlake
            entry_point: suffice
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--endpoint"
              - "${var.chat_endpoint}"
              - "--backtest"
              - "{{job.parameters.backtest}}"
              - "--at"
              - "{{job.parameters.at}}"
              - "--deciders"
              - "{{job.parameters.deciders}}"
              - "--samples"
              - "{{job.parameters.samples}}"
              - "--min-agreement"
              - "{{job.parameters.min_agreement}}"
              - "--verify"
              - "{{job.parameters.verify}}"
              - "--minutes"
              - "{{job.parameters.minutes}}"
              - "--code-commit"
              - "${bundle.git.commit}"
              - "--run-id"
              - "{{job.run_id}}"

    horizon:
      name: pitlake-horizon-${bundle.target}
      description: >-
        Runs on demand. For each decider and instant of a recorded backtest (default its last
        decision), keeps only the items that became public within each horizon of a ladder of days
        before the instant, withholds everything else, and decides again: the degradation curve.
        Between the last horizon that still gives the same decision and the first that does not,
        it halves the gap to the day, records the worlds either side of that truncation point as
        ablations for the independent check, and prints the curve per decider. Stops starting
        worlds after minutes and continues where it stopped when run again with the same
        parameters (ADR 0027).
      max_concurrent_runs: 1
      timeout_seconds: 7200
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: backtest
          default: ""
        - name: at
          default: ""
        - name: deciders
          default: strategy agent
        - name: samples
          default: "10"
        - name: min_agreement
          default: "0.8"
        - name: horizons
          default: 365 180 120 90 60 45 30 21 14 7 3 1 0
        - name: verify
          default: all
        - name: minutes
          default: "100"
      environments:
        - environment_key: horizon
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
              - databricks-sdk>=0.50
      tasks:
        - task_key: truncate
          environment_key: horizon
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: pitlake
            entry_point: truncate
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--endpoint"
              - "${var.chat_endpoint}"
              - "--backtest"
              - "{{job.parameters.backtest}}"
              - "--at"
              - "{{job.parameters.at}}"
              - "--deciders"
              - "{{job.parameters.deciders}}"
              - "--samples"
              - "{{job.parameters.samples}}"
              - "--min-agreement"
              - "{{job.parameters.min_agreement}}"
              - "--horizons"
              - "{{job.parameters.horizons}}"
              - "--verify"
              - "{{job.parameters.verify}}"
              - "--minutes"
              - "{{job.parameters.minutes}}"
              - "--code-commit"
              - "${bundle.git.commit}"
              - "--run-id"
              - "{{job.run_id}}"

    rag:
      name: pitlake-rag-${bundle.target}
      description: >-
        Runs on demand. Splits the committed 10-K and 10-Q text into passages, embeds the new ones,
        syncs the AI Search index, then fine-tunes a low-rank query adapter on questions generated
        from Gold fundamentals and measures base against tuned retrieval on later filings, the index
        against exact Euclidean search, and that no filing is retrievable before its acceptance.
        With replay set to a retrieval run ID it only re-evaluates that run from its recorded
        versions and fails unless every result is identical (ADR 0010).
      max_concurrent_runs: 1
      timeout_seconds: 10800
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: max_chunks
          default: "0"
        - name: train_until
          default: ${var.rag_train_until}
        - name: test_from
          default: ${var.rag_test_from}
        - name: rank
          default: "16"
        - name: epochs
          default: "150"
        - name: ann_sample
          default: "100"
        - name: answer_sample
          default: "20"
        - name: replay
          default: ""
      environments:
        - environment_key: rag
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
              - mlflow-skinny>=2.20,<4
              - databricks-sdk>=0.50
      tasks:
        - task_key: build
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.replay}}"
            right: ""

        - task_key: chunk
          depends_on:
            - task_key: build
              outcome: "true"
          environment_key: rag
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: chunk_filings
            parameters: ["--catalog", "${var.catalog}", "--run-id", "{{job.run_id}}"]

        - task_key: embed
          depends_on:
            - task_key: chunk
          environment_key: rag
          max_retries: 1
          min_retry_interval_millis: 120000
          python_wheel_task:
            package_name: pitlake
            entry_point: embed_chunks
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--endpoint"
              - "${var.embedding_endpoint}"
              - "--max-chunks"
              - "{{job.parameters.max_chunks}}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: index
          depends_on:
            - task_key: embed
          environment_key: rag
          max_retries: 1
          min_retry_interval_millis: 120000
          python_wheel_task:
            package_name: pitlake
            entry_point: sync_index
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--endpoint"
              - "${var.vector_search_endpoint}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: tune
          depends_on:
            - task_key: index
          environment_key: rag
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: pitlake
            entry_point: tune_retriever
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--experiment"
              - "/Users/${workspace.current_user.userName}/pitlake-rag-${bundle.target}"
              - "--embedding-endpoint"
              - "${var.embedding_endpoint}"
              - "--chat-endpoint"
              - "${var.chat_endpoint}"
              - "--train-until"
              - "{{job.parameters.train_until}}"
              - "--test-from"
              - "{{job.parameters.test_from}}"
              - "--rank"
              - "{{job.parameters.rank}}"
              - "--epochs"
              - "{{job.parameters.epochs}}"
              - "--ann-sample"
              - "{{job.parameters.ann_sample}}"
              - "--answer-sample"
              - "{{job.parameters.answer_sample}}"
              - "--code-commit"
              - "${bundle.git.commit}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: replay
          depends_on:
            - task_key: build
              outcome: "false"
          environment_key: rag
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: pitlake
            entry_point: tune_retriever
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--experiment"
              - "/Users/${workspace.current_user.userName}/pitlake-rag-${bundle.target}"
              - "--embedding-endpoint"
              - "${var.embedding_endpoint}"
              - "--replay"
              - "{{job.parameters.replay}}"
              - "--code-commit"
              - "${bundle.git.commit}"
              - "--run-id"
              - "{{job.run_id}}"

    ask:
      name: pitlake-ask-${bundle.target}
      description: >-
        Answers one question about the companies' filings as of an instant (default now): embeds it,
        applies the latest tuned adapter, retrieves only passages knowable at that instant from the
        AI Search index, and has the chat model answer from them with citations. Every answer is
        recorded in control.rag_answers and MLflow (ADR 0010).
      max_concurrent_runs: 3
      timeout_seconds: 900
      parameters:
        - name: question
          default: "What were Apple's total net sales in the most recent quarter?"
        - name: as_of
          default: ""
        - name: symbol
          default: ""
        - name: retrieval_run
          default: ""
      environments:
        - environment_key: rag
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
              - mlflow-skinny>=2.20,<4
              - databricks-sdk>=0.50
      tasks:
        - task_key: ask
          environment_key: rag
          max_retries: 0
          python_wheel_task:
            package_name: pitlake
            entry_point: ask
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--experiment"
              - "/Users/${workspace.current_user.userName}/pitlake-rag-${bundle.target}"
              - "--embedding-endpoint"
              - "${var.embedding_endpoint}"
              - "--chat-endpoint"
              - "${var.chat_endpoint}"
              - "--question"
              - "{{job.parameters.question}}"
              - "--as-of"
              - "{{job.parameters.as_of}}"
              - "--symbol"
              - "{{job.parameters.symbol}}"
              - "--retrieval-run"
              - "{{job.parameters.retrieval_run}}"
              - "--run-id"
              - "{{job.run_id}}"

    gpu_check:
      name: pitlake-gpu-check-${bundle.target}
      description: >-
        Runs on demand. Checks that serverless GPU (AI Runtime) is usable for fine-tuning the answer
        generator: an A10, the ML libraries, the Llama 3.2 3B base model from system.ai, a few LoRA
        steps, and the Unity Catalog volumes. Prints one line per check.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      environments:
        - environment_key: gpu
          spec:
            base_environment: databricks_ai_v6
            dependencies:
              - ../dist/pitlake/*.whl
              - peft
      tasks:
        - task_key: check
          environment_key: gpu
          max_retries: 0
          ai_runtime_task:
            experiment: pitlake-gpu-check-${bundle.target}
            deployments:
              - command_path: ${workspace.file_path}/scripts/gpu/gpu_check.sh
                compute:
                  accelerator_type: GPU_1xA10
                  accelerator_count: 1

    generator:
      name: pitlake-generator-${bundle.target}
      description: >-
        Runs on demand. Fine-tunes Llama 3.2 3B Instruct with LoRA on serverless GPU to answer from
        the tuned retriever's point-in-time excerpts: prepare writes each question's prompt and
        target (the reported value with its citation, or that the filings do not say) to a volume,
        train fits the adapter and answers the test split with and without it, and score compares
        both with the chat endpoint on the same prompts (ADR 0010).
      max_concurrent_runs: 1
      timeout_seconds: 14400
      tags:
        catalog: ${var.catalog}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: retrieval_run
          default: ""
        - name: epochs
          default: "3"
        - name: learning_rate
          default: "0.0001"
        - name: lora_rank
          default: "16"
        - name: reference_sample
          default: "0"
      environments:
        - environment_key: rag
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
              - mlflow-skinny>=2.20,<4
              - databricks-sdk>=0.50
        - environment_key: gpu
          spec:
            base_environment: databricks_ai_v6
            dependencies:
              - ../dist/pitlake/*.whl
              - peft
      tasks:
        - task_key: prepare
          environment_key: rag
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: prepare_generator
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--retrieval-run"
              - "{{job.parameters.retrieval_run}}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: train
          depends_on:
            - task_key: prepare
          environment_key: gpu
          max_retries: 0
          ai_runtime_task:
            experiment: pitlake-generator-${bundle.target}
            deployments:
              - command_path: ${workspace.file_path}/scripts/gpu/train_generator.sh
                compute:
                  accelerator_type: GPU_1xA10
                  accelerator_count: 1

        - task_key: score
          depends_on:
            - task_key: train
          environment_key: rag
          max_retries: 0
          python_wheel_task:
            package_name: pitlake
            entry_point: score_generator
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--experiment"
              - "/Users/${workspace.current_user.userName}/pitlake-rag-${bundle.target}"
              - "--chat-endpoint"
              - "${var.chat_endpoint}"
              - "--reference-sample"
              - "{{job.parameters.reference_sample}}"
              - "--code-commit"
              - "${bundle.git.commit}"
              - "--run-id"
              - "{{job.run_id}}"

    reranker:
      name: pitlake-reranker-${bundle.target}
      description: >-
        Runs on demand. Fine-tunes Llama 3.2 1B Instruct with LoRA on serverless GPU to rerank the
        tuned retriever's point-in-time top 20 passages: prepare writes each question's candidates
        to a volume, train fits the adapter by validation MRR@10 and reranks the test split with
        and without it, and score compares both with the tuned order, by retrieval metrics and by
        the chat endpoint's answers from each order's top five (ADR 0017).
      max_concurrent_runs: 1
      timeout_seconds: 14400
      tags:
        catalog: ${var.catalog}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: retrieval_run
          default: ""
        - name: epochs
          default: "2"
        - name: learning_rate
          default: "0.0001"
        - name: lora_rank
          default: "16"
        - name: answer_sample
          default: "0"
      environments:
        - environment_key: rag
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
              - mlflow-skinny>=2.20,<4
              - databricks-sdk>=0.50
        - environment_key: gpu
          spec:
            base_environment: databricks_ai_v6
            dependencies:
              - ../dist/pitlake/*.whl
              - peft
      tasks:
        - task_key: prepare
          environment_key: rag
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: prepare_reranker
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--retrieval-run"
              - "{{job.parameters.retrieval_run}}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: train
          depends_on:
            - task_key: prepare
          environment_key: gpu
          max_retries: 0
          ai_runtime_task:
            experiment: pitlake-reranker-${bundle.target}
            deployments:
              - command_path: ${workspace.file_path}/scripts/gpu/train_reranker.sh
                compute:
                  accelerator_type: GPU_1xA10
                  accelerator_count: 1

        - task_key: score
          depends_on:
            - task_key: train
          environment_key: rag
          max_retries: 0
          python_wheel_task:
            package_name: pitlake
            entry_point: score_reranker
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--experiment"
              - "/Users/${workspace.current_user.userName}/pitlake-rag-${bundle.target}"
              - "--chat-endpoint"
              - "${var.chat_endpoint}"
              - "--answer-sample"
              - "{{job.parameters.answer_sample}}"
              - "--code-commit"
              - "${bundle.git.commit}"
              - "--run-id"
              - "{{job.run_id}}"

    operations:
      name: pitlake-operations-${bundle.target}
      description: >-
        Runs daily after ingest and transform. Records the workspace's usage and list-price cost
        per job and per platform product and the queries, time, files read and skipped and rows
        per job from the system tables, the size, files, retention and
        predictive optimization history of every table, and how old each Silver table's newest
        row is, and refreshes the Lakehouse Monitoring profile and drift metrics of the Silver
        tables and records which monitored columns drifted. Fails if Gold's retention has drifted, if a monitor refresh fails or, in prod, if a
        Silver table is older than its dataset's tolerance, and clears staging folders untouched
        for a week (ADR 0011).
      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: "0 0 10 * * ?"
        timezone_id: UTC
        pause_status: ${var.operations_schedule_status}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: lookback_days
          default: "30"
        - name: staging_days
          default: "7"
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
      tasks:
        - task_key: costs
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: operations
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--step"
              - "costs"
              - "--lookback-days"
              - "{{job.parameters.lookback_days}}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: queries
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: operations
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--step"
              - "queries"
              - "--lookback-days"
              - "{{job.parameters.lookback_days}}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: storage
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: operations
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--step"
              - "storage"
              - "--staging-days"
              - "{{job.parameters.staging_days}}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: freshness
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: operations
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--step"
              - "freshness"
              - "--enforce-freshness"
              - "${var.freshness_enforced}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: monitors
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: operations
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--step"
              - "monitors"
              - "--assets-dir"
              - "${workspace.root_path}/monitoring"
              - "--warehouse-id"
              - "${var.warehouse_id}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: drift
          depends_on:
            - task_key: monitors
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: operations
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--step"
              - "drift"
              - "--run-id"
              - "{{job.run_id}}"

  experiments:
    backtests:
      name: /Users/${workspace.current_user.userName}/pitlake-backtests-${bundle.target}
    rag_experiment:
      name: /Users/${workspace.current_user.userName}/pitlake-rag-${bundle.target}

resources:
  jobs:
    smoke:
      name: pitlake-smoke-${bundle.target}
      description: Proves the deployment works - checks schemas and the landing volume, writes to control.deploy_log.
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
      tasks:
        - task_key: smoke
          environment_key: default
          python_wheel_task:
            package_name: pitlake
            entry_point: smoke
            parameters: ["--catalog", "${var.catalog}"]

    ingest:
      name: pitlake-ingest-${bundle.target}
      description: >-
        Collects missing source files into the landing volume, records their manifests, loads them
        into Bronze, and commits the new Bronze versions only if every source succeeded. Safe to
        re-run at any time; reloading a period never duplicates rows. Sources run in parallel, one
        for_each iteration per dataset in control.source_registry (ADR 0005).
      max_concurrent_runs: 1
      timeout_seconds: 10800
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: UTC
        pause_status: ${var.ingest_schedule_status}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: max_files
          default: "30"
        - name: period_start
          default: ""
        - name: period_end
          default: ""
        - name: reload
          default: "false"
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
              - ../dist/collector/*.whl
      tasks:
        - task_key: plan
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: plan_ingest
            parameters: ["--catalog", "${var.catalog}"]

        - task_key: collect
          depends_on:
            - task_key: plan
          for_each_task:
            inputs: "{{tasks.plan.values.datasets}}"
            concurrency: ${var.ingest_concurrency}
            task:
              task_key: collect_feed
              environment_key: default
              max_retries: 1
              min_retry_interval_millis: 300000
              python_wheel_task:
                package_name: pitlake-collector
                entry_point: pitlake-collector
                parameters:
                  - "sync"
                  - "--config"
                  - "${workspace.file_path}/collector/config.${bundle.target}.toml"
                  - "--feed"
                  - "{{input}}"
                  - "--landing"
                  - "volume"
                  # Not a fixed /tmp path: iterations sharing a machine run as different users.
                  - "--private-work-dir"
                  - "--max-files"
                  - "{{job.parameters.max_files}}"

        # ALL_DONE: record and load what did land when a source fails; commit still does not run.
        - task_key: discover_manifests
          depends_on:
            - task_key: collect
          run_if: ALL_DONE
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: discover_manifests
            parameters: ["--catalog", "${var.catalog}"]

        - task_key: load_bronze
          depends_on:
            - task_key: discover_manifests
          for_each_task:
            inputs: "{{tasks.plan.values.datasets}}"
            concurrency: ${var.ingest_concurrency}
            task:
              task_key: load_dataset
              environment_key: default
              max_retries: 2
              min_retry_interval_millis: 120000
              python_wheel_task:
                package_name: pitlake
                entry_point: load_bronze
                parameters:
                  - "--catalog"
                  - "${var.catalog}"
                  - "--dataset"
                  - "{{input}}"
                  - "--max-files"
                  - "{{job.parameters.max_files}}"
                  - "--period-start"
                  - "{{job.parameters.period_start}}"
                  - "--period-end"
                  - "{{job.parameters.period_end}}"
                  - "--reload"
                  - "{{job.parameters.reload}}"
                  - "--run-id"
                  - "{{job.run_id}}"

        - task_key: commit
          depends_on:
            - task_key: collect
            - task_key: discover_manifests
            - task_key: load_bronze
          run_if: ALL_SUCCESS
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: commit_ingest
            parameters: ["--catalog", "${var.catalog}", "--run-id", "{{job.run_id}}"]

    transform:
      name: pitlake-transform-${bundle.target}
      description: >-
        Cleans the committed Bronze versions into Silver: types every column, assigns knowable_at,
        quarantines rows that fail a drop rule and stops on a halt rule (spec sections 5 and 6,
        ADR 0006). The quality gate then compares the two crypto venues minute by minute and checks
        rejection rates against control.quality_thresholds (ADR 0007); the new Silver versions are
        committed only if every table and the gate passed. Starts when the ingest job commits.
      max_concurrent_runs: 1
      timeout_seconds: 10800
      trigger:
        pause_status: ${var.transform_trigger_status}
        table_update:
          table_names:
            - ${var.catalog}.control.ingest_commits
          condition: ANY_UPDATED
          wait_after_last_change_seconds: 60
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: max_files
          default: "30"
        - name: period_start
          default: ""
        - name: period_end
          default: ""
        - name: reprocess
          default: "false"
        # none, knowable_at_missing, knowable_at_before_event, venue_price_divergence or
        # venue_missing_minutes.
        - name: inject_fault
          default: "none"
        # Separated by spaces: bundle run --params splits on commas.
        - name: datasets
          default: ""
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/pitlake/*.whl
      tasks:
        - task_key: plan
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: plan_transform
            parameters:
              ["--catalog", "${var.catalog}", "--datasets", "{{job.parameters.datasets}}"]

        - task_key: transform
          depends_on:
            - task_key: plan
          for_each_task:
            inputs: "{{tasks.plan.values.groups}}"
            concurrency: ${var.transform_concurrency}
            task:
              task_key: transform_group
              environment_key: default
              max_retries: 1
              min_retry_interval_millis: 120000
              python_wheel_task:
                package_name: pitlake
                entry_point: transform_silver
                parameters:
                  - "--catalog"
                  - "${var.catalog}"
                  - "--datasets"
                  - "{{input}}"
                  - "--max-files"
                  - "{{job.parameters.max_files}}"
                  - "--period-start"
                  - "{{job.parameters.period_start}}"
                  - "--period-end"
                  - "{{job.parameters.period_end}}"
                  - "--reprocess"
                  - "{{job.parameters.reprocess}}"
                  - "--inject-fault"
                  - "{{job.parameters.inject_fault}}"
                  - "--run-id"
                  - "{{job.run_id}}"

        - task_key: gate
          depends_on:
            - task_key: transform
          run_if: ALL_SUCCESS
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: quality_gate
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--run-id"
              - "{{job.run_id}}"
              - "--period-start"
              - "{{job.parameters.period_start}}"
              - "--period-end"
              - "{{job.parameters.period_end}}"
              - "--reprocess"
              - "{{job.parameters.reprocess}}"
              - "--inject-fault"
              - "{{job.parameters.inject_fault}}"

        - task_key: commit
          depends_on:
            - task_key: gate
          run_if: ALL_SUCCESS
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pitlake
            entry_point: commit_transform
            parameters: ["--catalog", "${var.catalog}", "--run-id", "{{job.run_id}}"]

resources:
  apps:
    console:
      name: pitlake-console-${bundle.target}
      description: >-
        Coverage, freshness, rejection rates, crypto-venue disagreements, backtests and query
        performance of ${var.catalog}, read from its control tables, questions to its two Genie
        spaces, and a form that starts the ingest job for chosen datasets and dates (ADR 0012,
        ADR 0013, ADR 0014).
      source_code_path: ../app
      config:
        command: ["streamlit", "run", "app.py"]
        env:
          - name: PITLAKE_CATALOG
            value: ${var.catalog}
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: INGEST_JOB_ID
            value_from: ingest-job
          - name: GENIE_MARKETS_SPACE_ID
            value_from: markets-genie
          - name: GENIE_OPERATIONS_SPACE_ID
            value_from: operations-genie
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: ingest-job
          job:
            id: ${resources.jobs.ingest.id}
            permission: CAN_MANAGE_RUN
        - name: markets-genie
          genie_space:
            name: PITLake markets
            space_id: ${resources.genie_spaces.markets_genie.id}
            permission: CAN_RUN
        - name: operations-genie
          genie_space:
            name: PITLake operations
            space_id: ${resources.genie_spaces.operations_genie.id}
            permission: CAN_RUN
        - name: source-registry
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.control.source_registry
            permission: SELECT
        - name: silver-load-log
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.control.silver_load_log
            permission: SELECT
        - name: freshness
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.control.freshness
            permission: SELECT
        - name: quality-rules
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.control.quality_rules
            permission: SELECT
        - name: cross-venue-log
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.control.cross_venue_log
            permission: SELECT
        - name: quality-gate-results
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.control.quality_gate_results
            permission: SELECT
        - name: backtest-runs
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.control.backtest_runs
            permission: SELECT
        - name: query-stats
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.control.query_stats
            permission: SELECT
        - name: gold-bars-1d
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.bars_1d
            permission: SELECT
        - name: gold-bars-1m
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.bars_1m
            permission: SELECT
        - name: gold-features
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.features
            permission: SELECT
        - name: gold-fundamentals
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.fundamentals
            permission: SELECT
        - name: drift
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.control.drift
            permission: SELECT
        - name: job-costs
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.control.job_costs
            permission: SELECT
        - name: table-health
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.control.table_health
            permission: SELECT

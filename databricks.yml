bundle:
  name: pitlake
  databricks_cli_version: ">=0.250.0"

include:
  - resources/*.yml

artifacts:
  # dynamic_version: serverless caches environments by package version.
  pitlake_wheel:
    type: whl
    build: uv build --wheel --package pitlake --clear --out-dir dist/pitlake
    path: .
    files:
      - source: dist/pitlake/*.whl
    dynamic_version: true

  collector_wheel:
    type: whl
    build: uv build --wheel --package pitlake-collector --clear --out-dir dist/collector
    path: .
    files:
      - source: dist/collector/*.whl
    dynamic_version: true

variables:
  catalog:
    description: Unity Catalog catalog that holds every layer for this environment.
  ingest_schedule_status:
    description: PAUSED or UNPAUSED. The daily ingest schedule stays paused until the backfill is done.
    default: PAUSED
  ingest_concurrency:
    description: >-
      Sources the ingest job collects and loads at the same time (for_each concurrency). Each
      iteration is its own serverless task, so this trades wall-clock time for concurrent compute.
    default: 3
  transform_trigger_status:
    description: >-
      PAUSED or UNPAUSED. While unpaused, the transform job starts whenever the ingest job commits
      (a new row in control.ingest_commits).
    default: PAUSED
  transform_concurrency:
    description: Groups of Silver tables the transform job cleans at the same time (for_each).
    default: 3
  operations_schedule_status:
    description: PAUSED or UNPAUSED. The daily operations job records costs and table health.
    default: PAUSED
  freshness_enforced:
    description: >-
      "true" makes the operations job fail when a Silver table is older than its dataset's
      tolerance. Dev holds a fixed historical window, so it only records freshness.
    default: "false"
  embedding_endpoint:
    description: Model serving endpoint that embeds filing chunks and questions (ADR 0010).
    default: databricks-gte-large-en
  chat_endpoint:
    description: Model serving endpoint that writes answers from retrieved excerpts (ADR 0010).
    default: databricks-meta-llama-3-3-70b-instruct
  vector_search_endpoint:
    description: >-
      AI Search (vector search) endpoint that serves the filing index. Free Edition allows one per
      account, so dev and prod share it; each catalog has its own index.
    default: pitlake
  rag_train_until:
    description: Questions answerable before this date train the retriever (ADR 0010).
    default: "2024-01-01"
  rag_test_from:
    description: Questions answerable from this date on test it; those in between validate.
    default: "2025-01-01"

targets:
  dev:
    default: true
    variables:
      catalog: pitlake_dev
      rag_train_until: "2024-07-01"
      rag_test_from: "2024-10-15"

  prod:
    variables:
      catalog: pitlake_prod
      ingest_schedule_status: UNPAUSED
      transform_trigger_status: UNPAUSED
      operations_schedule_status: UNPAUSED
      freshness_enforced: "true"

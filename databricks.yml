bundle:
  name: pitlake
  databricks_cli_version: ">=0.250.0"

include:
  - resources/*.yml

artifacts:
  # Each wheel gets its own output directory: --clear removes wheels of earlier versions, so
  # each glob in resources/jobs.yml matches exactly one file.
  # Serverless caches environments by package version; dynamic_version gives every deploy a
  # unique version so it installs the code that was just built.
  pitlake_wheel:
    type: whl
    build: uv build --wheel --package pitlake --clear --out-dir dist/pitlake
    path: .
    files:
      - source: dist/pitlake/*.whl
    dynamic_version: true

  collector_wheel:
    type: whl
    build: uv build --wheel --package pitlake-collector --clear --out-dir dist/collector
    path: .
    files:
      - source: dist/collector/*.whl
    dynamic_version: true

variables:
  catalog:
    description: Unity Catalog catalog that holds every layer for this environment.
  ingest_schedule_status:
    description: PAUSED or UNPAUSED. The daily ingest schedule stays paused until the backfill is done.
    default: PAUSED

# Dev and prod live in the same Free Edition workspace and are isolated by catalog.
# Auth comes from the environment (DATABRICKS_CONFIG_PROFILE locally, DATABRICKS_HOST/TOKEN in CI),
# so no host or credential is committed.
targets:
  dev:
    default: true
    variables:
      catalog: pitlake_dev

  prod:
    variables:
      catalog: pitlake_prod

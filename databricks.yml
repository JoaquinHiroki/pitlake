bundle:
  name: pitlake
  databricks_cli_version: ">=0.250.0"

include:
  - resources/*.yml

artifacts:
  # dynamic_version: serverless caches environments by package version.
  pitlake_wheel:
    type: whl
    build: uv build --wheel --package pitlake --clear --out-dir dist/pitlake
    path: .
    files:
      - source: dist/pitlake/*.whl
    dynamic_version: true

  collector_wheel:
    type: whl
    build: uv build --wheel --package pitlake-collector --clear --out-dir dist/collector
    path: .
    files:
      - source: dist/collector/*.whl
    dynamic_version: true

variables:
  catalog:
    description: Unity Catalog catalog that holds every layer for this environment.
  ingest_schedule_status:
    description: PAUSED or UNPAUSED. The daily ingest schedule stays paused until the backfill is done.
    default: PAUSED
  ingest_concurrency:
    description: >-
      Sources the ingest job collects and loads at the same time (for_each concurrency). Each
      iteration is its own serverless task, so this trades wall-clock time for concurrent compute.
    default: 3
  transform_trigger_status:
    description: >-
      PAUSED or UNPAUSED. While unpaused, the transform job starts whenever the ingest job commits
      (a new row in control.ingest_commits).
    default: PAUSED
  transform_concurrency:
    description: Groups of Silver tables the transform job cleans at the same time (for_each).
    default: 3

targets:
  dev:
    default: true
    variables:
      catalog: pitlake_dev

  prod:
    variables:
      catalog: pitlake_prod
      ingest_schedule_status: UNPAUSED
      transform_trigger_status: UNPAUSED

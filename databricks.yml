bundle:
  name: pitlake
  databricks_cli_version: ">=0.250.0"

include:
  - resources/*.yml

artifacts:
  pitlake_wheel:
    type: whl
    # --clear removes wheels of earlier versions, so ../dist/*.whl matches exactly one file.
    build: uv build --wheel --package pitlake --clear
    path: .
    # Serverless caches environments by package version; a unique version per deploy makes
    # every deploy install the code that was just built.
    dynamic_version: true

variables:
  catalog:
    description: Unity Catalog catalog that holds every layer for this environment.
  ingest_schedule_status:
    description: PAUSED or UNPAUSED. The daily ingest schedule stays paused until the collector is live.
    default: PAUSED

# Dev and prod live in the same Free Edition workspace and are isolated by catalog.
# Auth comes from the environment (DATABRICKS_CONFIG_PROFILE locally, DATABRICKS_HOST/TOKEN in CI),
# so no host or credential is committed.
targets:
  dev:
    default: true
    variables:
      catalog: pitlake_dev

  prod:
    variables:
      catalog: pitlake_prod
